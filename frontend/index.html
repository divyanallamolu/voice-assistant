<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS — Voice Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="state-disconnected">

    <div class="scene-background" aria-hidden="true">
        <img
            src="assets/background.png"
            alt=""
            class="scene-background-image"
            fetchpriority="high"
        >
        <div class="scene-overlay"></div>
    </div>

    <div class="app-container">

        <header class="app-header">
            <div class="brand-block">
                <div class="brand-row">
                    <h1 class="brand-title">JARVIS</h1>
                    <img
                        src="assets/jarvis-brand.png"
                        alt=""
                        class="identity-eyes"
                        width="32"
                        height="40"
                        aria-hidden="true"
                    >
                </div>
                <p class="brand-tagline">Personal AI Assistant</p>
            </div>

            <div class="connection-pill" role="status" aria-live="polite">
                <span class="connection-dot" id="connectionDot" aria-hidden="true"></span>
                <span class="connection-label" id="status">DISCONNECTED</span>
            </div>
        </header>

        <main class="main-content">

            <section class="voice-section" aria-label="Voice interaction">
                <div class="voice-orb" id="aiCore">
                    <div class="voice-orb-glow" aria-hidden="true"></div>
                    <div class="voice-orb-ring voice-orb-ring-1" aria-hidden="true"></div>
                    <div class="voice-orb-ring voice-orb-ring-2" aria-hidden="true"></div>
                    <div class="voice-orb-core">
                        <img
                            src="assets/jarvis-interface.png"
                            alt=""
                            class="voice-orb-image"
                            width="180"
                            height="180"
                            aria-hidden="true"
                        >
                    </div>
                </div>

                <p class="voice-status" id="voiceStatus" aria-live="polite">Offline</p>
                <p class="system-status" id="systemStatus" aria-hidden="true">● OFFLINE</p>

                <button id="voiceButton" class="mic-button" type="button" aria-label="Toggle microphone">
                    <span class="mic-button-glow" aria-hidden="true"></span>
                    <span class="mic-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
                            <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
                            <line x1="12" y1="18" x2="12" y2="22"/>
                            <line x1="8" y1="22" x2="16" y2="22"/>
                        </svg>
                    </span>
                    <span class="mic-label" id="micLabel">Start Listening</span>
                </button>
            </section>

            <section class="conversation-section" aria-label="Conversation">

                <article class="glass-card transcript-card">
                    <header class="card-header">
                        <h2>Live Transcript</h2>
                    </header>
                    <div class="card-body">
                        <div id="liveTranscript" class="transcript-content" aria-live="polite">
                            <span class="transcript-prefix" aria-hidden="true">🎤</span>
                            <span class="transcript-text">Awaiting voice input...</span>
                        </div>
                    </div>
                </article>

                <article class="glass-card response-card">
                    <header class="card-header">
                        <h2>JARVIS Response</h2>
                    </header>
                    <div class="card-body">
                        <div id="response" class="response-content" aria-live="polite">
                            Standing by for your command...
                        </div>
                    </div>
                </article>

                <div class="meta-row">
                    <article class="glass-card meta-card tool-panel">
                        <header class="card-header">
                            <h2>Tool</h2>
                        </header>
                        <div class="card-body">
                            <div id="toolStatus" class="tool-status-content">
                                <span class="tool-icon" aria-hidden="true">🔧</span>
                                <span class="tool-label">Status</span>
                                <span class="tool-name" id="toolName">Standby</span>
                                <span class="tool-state" id="toolState">Ready</span>
                            </div>
                        </div>
                    </article>

                    <article class="glass-card meta-card reminder-panel">
                        <header class="card-header">
                            <h2>Reminders</h2>
                        </header>
                        <div class="card-body">
                            <div id="reminderFeed" class="reminder-feed">
                                No active reminders displayed.
                            </div>
                        </div>
                    </article>
                </div>

            </section>

        </main>

        <footer class="command-bar">
            <div class="command-bar-inner">
                <label class="visually-hidden" for="messageInput">Message JARVIS</label>
                <input
                    type="text"
                    id="messageInput"
                    placeholder="Ask me anything..."
                    autocomplete="off"
                >
                <button id="sendButton" type="button" aria-label="Send message">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <line x1="5" y1="12" x2="19" y2="12"/>
                        <polyline points="12 5 19 12 12 19"/>
                    </svg>
                </button>
            </div>
        </footer>

    </div>

    <script src="app.js"></script>

</body>

</html>
